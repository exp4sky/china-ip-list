name: chn-ip-task

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'   # UTC，即北京时间每天 08:00 / 16:00 / 00:00

permissions:
  contents: write            # 显式给推送权限，双保险

jobs:
  run-get-ip-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: true   # 保证凭证留着，供后面 push 用

      - name: Set time zone
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0

      - name: Set globalization invariant mode
        run: echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> $GITHUB_ENV

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run
        # 跑 Release 产物，和上面 Build 的配置对齐
        run: dotnet run --configuration Release --project china_ip_list.csproj --no-build

      - name: Commit files
        run: |
          git config --local user.email "mayax@github.com"
          git config --local user.name "mayaxcn"

          # 文件不存在时 rm 别报错
          git rm -f chn_ip.txt chnroute.txt chn_ip_v6.txt chnroute_v6.txt || true
          git commit -m "删除旧有IP文件!" || echo "nothing to remove"

          OUT="${{ github.workspace }}/bin/Release/net7.0"
          cp "$OUT/chn_ip.txt" "$OUT/chnroute.txt" "$OUT/chn_ip_v6.txt" "$OUT/chnroute_v6.txt" .
          git add chn_ip.txt chnroute.txt chn_ip_v6.txt chnroute_v6.txt
          git commit -m "提交新的IP文件，更新于$(date "+%Y-%m-%d %H:%M:%S")"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0   # 锁死具体版本，别再跟 master
        with:
          token: ${{ secrets.CHNIP_GIT_KEY }}   # 关键：参数名改成 token
          branch: master
          
      - name: Run
        run: dotnet run --configuration Release --project china_ip_list.csproj --no-build

      - name: Debug Run result
        run: |
          echo "Run step finished, checking files..."
          ls -lh ${{ github.workspace }}/bin/Release/net7.0/
          echo "Current workspace:"
          ls -lh
