name: chn-ip-task

on:
  push:
    branches: [ master ]
  workflow_dispatch:
  schedule:
    - cron: '0 */8 * * *'

permissions:
  contents: write

jobs:
  run-get-ip-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          persist-credentials: false   # 关键：禁用默认凭证，防止覆盖你的 PAT
          fetch-depth: 0

      - name: Set time zone
        run: sudo timedatectl set-timezone 'Asia/Shanghai'

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 7.0

      - name: Set globalization invariant mode
        run: echo "DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1" >> $GITHUB_ENV

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run
        timeout-minutes: 3
        run: dotnet run --configuration Release --project china_ip_list.csproj --no-build

      - name: Commit files
        run: |
          git config --local user.email "mayax@github.com"
          git config --local user.name "mayaxcn"
          git rm -f chn_ip.txt chnroute.txt chn_ip_v6.txt chnroute_v6.txt || true
          git commit -m "删除旧有IP文件!" || echo "nothing to remove"
          
          OUT="${{ github.workspace }}/bin/Release/net7.0"
          cp "$OUT/chn_ip.txt" "$OUT/chnroute.txt" "$OUT/chn_ip_v6.txt" "$OUT/chnroute_v6.txt" .
          
          git add chn_ip.txt chnroute.txt chn_ip_v6.txt chnroute_v6.txt
          git commit -m "提交新的IP文件，更新于$(date "+%Y-%m-%d %H:%M:%S")"

      - name: Push changes
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.CHNIP_GIT_KEY }}   # 必须是 github_token
          repository: ${{ github.repository }}         # 显式指定当前仓库
          branch: master
